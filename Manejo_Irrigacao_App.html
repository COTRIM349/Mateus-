<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manejo de Irrigação — Karitel / RDM</title>
<style>
  :root{
    --verde:#1f6b3b; --verde2:#2e8b51; --terra:#7a5230; --areia:#f4f1ea;
    --cinza:#5b6168; --borda:#d9d4c7; --branco:#fff; --azul:#17607d;
    --alerta:#b5361f; --ok:#1f6b3b; --amarelo:#c9972b; --sombra:0 1px 3px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--areia);color:#232a25;font-size:15px}
  header{background:var(--verde);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:var(--sombra)}
  header h1{font-size:17px;margin:0;font-weight:700;line-height:1.1}
  header small{opacity:.85;font-weight:400}
  nav{display:flex;flex-wrap:wrap;gap:2px;background:var(--verde2);padding:0 8px;position:sticky;top:48px;z-index:49}
  nav button{background:transparent;border:0;color:#eafbe8;padding:11px 14px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
  nav button.active{color:#fff;font-weight:700;border-bottom-color:#fff;background:rgba(255,255,255,.08)}
  main{padding:14px;max-width:1200px;margin:0 auto}
  .card{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:var(--sombra)}
  .card h2{margin:0 0 10px;font-size:16px;color:var(--verde)}
  .card h3{margin:14px 0 8px;font-size:14px;color:var(--terra)}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  label{display:block;font-size:12px;color:var(--cinza);margin-bottom:3px;font-weight:600}
  input,select{width:100%;padding:8px;border:1px solid var(--borda);border-radius:7px;font-size:14px;background:#fff}
  input[type=date]{min-height:38px}
  button.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
  button.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
  button.btn.azul{background:var(--azul)}
  button.btn.terra{background:var(--terra)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 8px;text-align:right;border-bottom:1px solid #ececec;white-space:nowrap}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  thead th{background:var(--verde);color:#fff;position:sticky;top:0;font-size:12px;font-weight:600}
  tbody tr:nth-child(even){background:#faf9f4}
  .tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--borda);border-radius:8px}
  .tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700}
  .t-irr{background:#fde8e4;color:var(--alerta)}
  .t-ok{background:#e4f3e8;color:var(--ok)}
  .t-esp{background:#fdf4e0;color:var(--amarelo)}
  .chip{display:inline-block;background:#eef3ee;border:1px solid var(--borda);border-radius:20px;padding:3px 10px;font-size:12px;margin:2px}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .kpi .b{background:linear-gradient(135deg,#fff,#f3f6f2);border:1px solid var(--borda);border-radius:10px;padding:12px}
  .kpi .b .n{font-size:22px;font-weight:800;color:var(--verde)}
  .kpi .b .t{font-size:12px;color:var(--cinza)}
  .muted{color:var(--cinza);font-size:12px}
  .sel-pivo{cursor:pointer}
  .sel-pivo.on{background:#e4f3e8 !important}
  input.mini{width:70px;padding:5px;text-align:right}
  details summary{cursor:pointer;font-weight:700;color:var(--verde);padding:6px 0}
  .os-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--verde);padding-bottom:8px;margin-bottom:10px}
  .pill{font-size:11px;padding:2px 8px;border-radius:5px;background:#eef3ee;color:var(--verde);font-weight:700}
  @media (max-width:640px){header h1{font-size:15px} main{padding:10px}}
  @media print{
    header,nav,.noprint{display:none !important}
    body{background:#fff;font-size:12px}
    main{max-width:100%;padding:0}
    .card{box-shadow:none;border:1px solid #999;page-break-inside:avoid}
    thead th{background:#ddd !important;color:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

</nav>

function load(){

  };
}

function today(){const d=new Date();return d.toISOString().slice(0,10);}

/* ---------- utilidades agronômicas ---------- */
function diasEntre(a,b){ // b - a em dias
  if(!a||!b) return null;
  const d1=new Date(a+"T00:00:00"), d2=new Date(b+"T00:00:00");
  return Math.round((d2-d1)/86400000);
}
function cropOf(num){ return DATA.crops[String(num)] || null; }
function ehSojaAlg(cult){ return cult==="SOJA"||cult==="ALGODÃO"; }
function kcDoDia(colk,dae){
  const arr=DATA.kc[colk]; if(!arr) return null;
  if(dae<1) return null;
  const i=Math.min(dae,arr.length)-1;
  return arr[i];
}
function etoFaz(faz){ const v = faz==="RDM"? S.etoRDM : S.etoKaritel; const n=parseFloat(v); return isNaN(n)?null:n; }
// O pivô aplica a uma vazão de lâmina ~constante (lam/hor igual em qualquer %).
// Horas = necessidade bruta ÷ vazão de lâmina. O percentímetro define a lâmina POR VOLTA:
// escolhemos o % cuja lâmina/volta mais se aproxima (>=) da necessidade, p/ aplicar em 1 volta.
const JANELA_H = 168; // horas numa semana — acima disso o pivô não repõe a demanda (gargalo)
function recomenda(pivo, necBruta){
  if(necBruta<=0) return null;
  const lam=pivo.lam, hor=pivo.hor;
  const vazaoLam = lam[0]/hor[0];            // mm por hora (constante do pivô)
  const horas = necBruta/vazaoLam;           // horas reais p/ repor a lâmina
  // percentímetro: menor velocidade (maior lâmina/volta) cuja lâmina >= necessidade
  let idx=lam.length-1, passes=1;
  for(let i=0;i<lam.length;i++){ if(lam[i]>=necBruta){ idx=i; break; } }
  if(lam[idx]<necBruta) passes=Math.ceil(necBruta/lam[idx]); // nem no % mais lento cabe em 1 volta
  const gargalo = horas>JANELA_H;            // não repõe dentro da semana
  return {pct:DATA.pcts[idx], lam:lam[idx], horas:horas, passes:passes, idx:idx, gargalo:gargalo};
}
function calcPivo(num){
  const pivo=DATA.pivos.find(p=>p.num===num); if(!pivo) return null;
  const crop=cropOf(num); const st=pstate(num);
  const plantio=st.plantio||(crop&&crop.plantio)||"";
  const ultIrrig=st.ultIrrig||plantio;
  const dataRef=S.dataRef||today();
  const dap=diasEntre(plantio,dataRef);
  const cult=crop?crop.cultura:"";
  const dae = (dap==null)?null:(ehSojaAlg(cult)? dap-DATA.emerg : dap);
  const colk=crop?crop.colk:null;
  const kc = (colk&&dae!=null)? kcDoDia(colk,dae) : null;
  const eto = etoFaz(pivo.faz);
  const etc = (kc!=null&&eto!=null)? kc*eto : null;
  const chuva = parseFloat(st.chuva!==""?st.chuva:S.chuvaPadrao)||0;
  const necLiq = (etc!=null)? Math.max(etc-chuva,0) : null;
  const necBruta = (necLiq!=null)? necLiq/DATA.ef : null;
  const rec = (necBruta!=null)? recomenda(pivo,necBruta) : null;
  const horas = rec? rec.horas : null;
  const energia = (horas!=null)? pivo.potkw*horas : null; // kWh
  const volume = (necBruta!=null)? necBruta*pivo.area*10 : null; // m3
  return {pivo,crop,st,plantio,ultIrrig,dap,dae,cult,kc,eto,etc,chuva,necLiq,necBruta,rec,horas,energia,volume};
}
function fmt(n,d=1){ return (n==null||isNaN(n))? "—" : Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }

    const r=calcPivo(p.num); if(!r) return "";
    let tag,hint="";

           if(r.rec&&r.rec.gargalo) tag+=`<br><span class="tag t-esp">⚠ gargalo &gt;168h</span>`;
           if(r.rec&&r.rec.passes>1) hint=`<br><span class="muted">${r.rec.passes} voltas</span>`; }
    return `<tr>
      <td class="l"><b>${p.nome}</b><br><span class="muted">${p.faz}·${p.mod}·${p.casa}</span></td>

      <td><b>${r.rec?fmt(r.rec.horas):"—"}</b></td>
      <td>${fmt(r.energia,0)}</td>

  }).join("");

    <div class="kpi" style="margin-bottom:4px">
      <div class="b"><div class="n">${nIrr}</div><div class="t">pivôs a irrigar</div></div>

      <div class="b"><div class="n">${fmt(somaVol,0)}</div><div class="t">m³ na semana</div></div>
      <div class="b"><div class="n">${S.dataRef}</div><div class="t">data de referência</div></div>
    </div>
  </div>
  <div class="card">
    <h2>💧 Manejo da semana</h2>
    <p class="muted">DAP = dias após plantio · DAE = DAP − ${DATA.emerg} (soja/algodão) · Kc da curva FAO-56 no DAE · ETc = Kc×ETo · Nec.líq = ETc − chuva · Nec.bruta = Nec.líq ÷ ${DATA.ef}. O % e as horas são o percentímetro que entrega a lâmina bruta em uma volta.</p>

}

        <td>${r&&r.rec?fmt(r.rec.horas):"—"}</td>
        <td>${r?fmt(r.energia,0):"—"}</td>
        <td>${irr?'<span class="tag t-irr">irrigar</span>':'<span class="tag t-ok">ok</span>'}</td>
      </tr>`;
    }).join("");
    const selMod=ps.filter(p=>S.selOS[p.num]).length;
    return `<details ${selMod?'open':''}><summary>Módulo ${m} — ${ps.length} pivôs${selMod?` · ${selMod} na OS`:''}</summary>
      <div class="row noprint" style="margin:6px 0">
        <button class="btn sec" onclick="selMod('${m}',true)">Selecionar irrigar</button>
        <button class="btn sec" onclick="selMod('${m}',false)">Limpar módulo</button>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th></th><th class="l">Pivô</th><th class="l">Cultura</th><th>Nec.bruta</th><th>%</th><th>Horas</th><th>kWh</th><th>Decisão</th></tr></thead>
        <tbody>${linhas}</tbody></table></div></details>`;
  }).join("");
  app.innerHTML=`
  <div class="card noprint">
    <h2>📋 Programação por módulo</h2>
    <p class="muted">Marque os pivôs que vão rodar. A OS geral consolida a seleção, com percentímetro, horas e energia por módulo.</p>
    <div class="grid g2">
      <div><label>Nº da OS</label><input id="o_num" type="number" value="${S.osNum}"></div>
      <div><label>Responsável</label><input id="o_resp" value="${S.osResp||''}" placeholder="quem recebe a OS"></div>
      <div><label>Data</label><input id="o_data" type="date" value="${S.dataRef}"></div>
      <div><label>Observação</label><input id="o_obs" value="${S.osObs||''}" placeholder="opcional"></div>
    </div>
    ${porMod||"<p>Nenhum pivô plantado. Libere na aba Plantio.</p>"}
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="gerarOS()">👁️ Gerar / atualizar OS</button>
      <button class="btn terra" onclick="window.print()">🖨️ Imprimir / PDF</button>
      <button class="btn azul" onclick="exportExcel()">📗 Exportar Excel</button>
    </div>
  </div>
  <div id="os-print"></div>`;
  ["o_num","o_resp","o_data","o_obs"].forEach(id=>{const el=g(id);if(el)el.onchange=()=>{S.osNum=g("o_num").value;S.osResp=g("o_resp").value;S.osObs=g("o_obs").value;save();};});
  gerarOS();
}
function toggleOS(num){ S.selOS[num]=!S.selOS[num]; save(); vOS(); }
function selMod(m,irrigarOnly){
  DATA.pivos.filter(p=>p.mod===m&&pstate(p.num).plantado).forEach(p=>{
    if(!irrigarOnly){ delete S.selOS[p.num]; return; }
    const r=calcPivo(p.num); S.selOS[p.num]= !!(r&&r.necBruta>0.1);
  });
  save(); vOS();
}
function osSelecionados(){
  return DATA.pivos.filter(p=>S.selOS[p.num]&&pstate(p.num).plantado).map(p=>calcPivo(p.num)).filter(r=>r&&r.rec);
}
function gerarOS(){
  const sel=osSelecionados();
  const box=g("os-print"); if(!box) return;
  if(!sel.length){ box.innerHTML=`<div class="card"><p class="muted">Nenhum pivô selecionado para a OS.</p></div>`; return; }
  let html=`<div class="card"><div class="os-head">
      <div><h2 style="margin:0">ORDEM DE SERVIÇO Nº ${S.osNum||1}</h2>
      <div class="muted">Karitel / Rio do Meio · Manejo de irrigação</div></div>
      <div style="text-align:right"><div class="pill">${g("o_data")?g("o_data").value:S.dataRef}</div>
      <div class="muted" style="margin-top:4px">Resp.: ${S.osResp||"—"}</div></div></div>`;
  let totE=0,totV=0,totH=0;
  MODS.forEach(m=>{
    const ps=sel.filter(r=>r.pivo.mod===m); if(!ps.length) return;
    let eMod=0,vMod=0, kwMax=0;
    const lin=ps.map(r=>{ eMod+=r.energia||0; vMod+=r.volume||0; kwMax+=r.pivo.potkw;
      return `<tr><td class="l"><b>${r.pivo.nome}</b> <span class="muted">${r.pivo.casa}</span></td>
        <td class="l">${r.cult}</td><td>${fmt(r.necBruta)}</td><td>${r.rec.pct}%</td>
        <td><b>${fmt(r.rec.horas)}</b></td><td>${fmt(r.volume,0)}</td><td>${fmt(r.energia,0)}</td></tr>`;
    }).join("");
    totE+=eMod; totV+=vMod;
    html+=`<div class="card"><h3>Módulo ${m} — ${ps.length} pivôs · demanda ${fmt(kwMax,0)} kW · ${fmt(eMod,0)} kWh</h3>
      <table><thead><tr><th class="l">Pivô</th><th class="l">Cultura</th><th>Lâmina (mm)</th><th>Percentímetro</th><th>Horas</th><th>Volume (m³)</th><th>Energia (kWh)</th></tr></thead>
      <tbody>${lin}</tbody>
      <tfoot><tr style="font-weight:700;background:#eef3ee"><td colspan="5" class="l">Subtotal módulo ${m}</td><td>${fmt(vMod,0)}</td><td>${fmt(eMod,0)}</td></tr></tfoot></table></div>`;
  });
  html+=`<div class="card"><div class="kpi">
      <div class="b"><div class="n">${sel.length}</div><div class="t">pivôs na OS</div></div>
      <div class="b"><div class="n">${fmt(totV,0)}</div><div class="t">volume total (m³)</div></div>
      <div class="b"><div class="n">${fmt(totE,0)}</div><div class="t">energia total (kWh)</div></div>
    </div>${S.osObs?`<p style="margin-top:10px"><b>Obs.:</b> ${S.osObs}</p>`:""}
    <p class="muted" style="margin-top:8px">Energia estimada = potência (kW) × horas de operação. Volume = lâmina bruta × área × 10.</p></div>`;
  box.innerHTML=html;
}
function exportExcel(){
  const sel=osSelecionados();
  if(!sel.length){ alert("Selecione ao menos um pivô para a OS."); return; }
  const wb=XLSX.utils.book_new();
  const head=["Módulo","Pivô","Casa","Cultura","Variedade","DAP","DAE","Kc","ETo","ETc","Chuva","Nec.líq","Nec.bruta","Percentímetro","Horas","Volume m³","Energia kWh"];
  const rows=[head];
  let totE=0,totV=0;
  MODS.forEach(m=>{
    sel.filter(r=>r.pivo.mod===m).forEach(r=>{
      totE+=r.energia||0; totV+=r.volume||0;
      rows.push([m,r.pivo.nome,r.pivo.casa,r.cult,r.crop?r.crop.variedade:"",r.dap,r.dae,
        round(r.kc,2),round(r.eto,1),round(r.etc,1),round(r.chuva,1),round(r.necLiq,1),round(r.necBruta,1),
        r.rec.pct+"%",round(r.rec.horas,1),round(r.volume,0),round(r.energia,0)]);
    });
  });
  rows.push([]); rows.push(["","","","","","","","","","","","","TOTAL","","",round(totV,0),round(totE,0)]);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=head.map((h,i)=>({wch:i===1?12:(i===4?16:(i===3?10:9))}));
  XLSX.utils.book_append_sheet(wb,ws,"OS "+(S.osNum||1));
  // aba resumo por módulo
  const res=[["Módulo","Pivôs","Demanda kW","Energia kWh","Volume m³"]];
  MODS.forEach(m=>{const ps=sel.filter(r=>r.pivo.mod===m);if(!ps.length)return;
    res.push([m,ps.length,round(ps.reduce((a,r)=>a+r.pivo.potkw,0),0),round(ps.reduce((a,r)=>a+(r.energia||0),0),0),round(ps.reduce((a,r)=>a+(r.volume||0),0),0)]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(res),"Resumo módulos");
  XLSX.writeFile(wb,`OS_${S.osNum||1}_${S.dataRef}.xlsx`);
}
function round(n,d){ if(n==null||isNaN(n))return""; const f=Math.pow(10,d); return Math.round(n*f)/f; }

/* ---------- VIEW: Ajuda ---------- */

    <h2>❓ Como usar — passo a passo</h2>
    <ol style="line-height:1.7">

function g(id){return document.getElementById(id);}
render();
</script>
