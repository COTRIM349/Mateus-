name: Patch cockpit once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: trigger cockpit patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch page
        run: |
          echo '' | base64 -d | python3 -
          git config user.name 'Cotrim Irrigacao Bot'
          git config user.email 'actions@github.com'
          git add 'app/(app)/balanco-hidrico/page.tsx'
          git commit -m 'feat(balanco): mostrar Kc ETo e umidade no cockpit visivel'
          git push origin main
