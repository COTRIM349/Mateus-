name: Apply Manejo V3 Interface

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-manejo-v3-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply manejo V3 interface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page_path = Path('app/(app)/balanco-hidrico/page.tsx')
          chart_path = Path('components/water-balance/CockpitCharts.tsx')
          page = page_path.read_text(encoding='utf-8')
          chart = chart_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 trecho, encontrado {count}')
              return text.replace(old, new, 1)

          # 1) Navegação principal: Gráfico primeiro e sem KPI geral da fazenda.
          page = replace_once(
              page,
              'const [activeTab, setActiveTab] = useState<"grafico" | "dados" | "decisao" | "lancamento">("dados");',
              'const [activeTab, setActiveTab] = useState<"grafico" | "dados" | "decisao" | "lancamento">("grafico");',
              'activeTab default',
          )
          page = replace_once(
              page,
              '  const { summary: farmSummary, states: farmStates, loading: farmLoading, refresh: refreshFarm } = useFarmHydricState();',
              '  const { states: farmStates, refresh: refreshFarm } = useFarmHydricState();',
              'farm hook',
          )
          page = replace_once(
              page,
              '      {/* KPIs da fazenda */}\n      <FarmKpiRow summary={farmSummary} states={farmStates} loading={farmLoading} />\n',
              '      {/* Navegação principal do manejo — cada aba tem função própria. */}\n      {selectedPivotId && assignment && (\n        <div className="rounded-2xl border border-gray-100 bg-white px-3 pt-1 dark:border-white/[0.06] dark:bg-graphite-900">\n          <Tabs tabs={TABS} activeTab={activeTab} onChange={(id) => setActiveTab(id as typeof activeTab)} />\n        </div>\n      )}\n',
              'top tabs',
          )

          # 2) Substitui o antigo cockpit + detalhes expansíveis por uma área única por aba.
          pattern = re.compile(r'      \{/\* Cockpit do pivô selecionado \*/\}.*?      \{selectedPivotId && assignment && \(\n        <Card className="overflow-hidden p-0">.*?      \)\}\n', re.S)
          replacement = '''      {/* Conteúdo por aba: Gráfico = manejo; Dados = auditoria; Decisão = ação; Lançamento = registro. */}
      {activeTab === "grafico" && (
        balanceRows.length > 0 ? (
          <Cockpit
            rows={balanceRows}
            summary={summary}
            projection={projectionRows}
            soilLayers={soilLayers}
            identity={{
              pivotName: selPivot?.name ?? null,
              cultureName: culture?.name ?? null,
              varietyName,
              seasonName,
              stage: assignment?.crop_stage ?? null,
              area: parcelArea,
              efficiency: selPivot ? ((selPivot.application_efficiency ?? selPivot.efficiency) * 100) : null,
            }}
            sensoryByDate={sensoryByDate}
            onShowDetail={() => setActiveTab("dados")}
          />
        ) : (calculating || loading) ? (
          <Card className="flex items-center justify-center gap-3 py-16">
            <div className="h-5 w-5 animate-spin rounded-full border-[3px] border-brand-100 border-t-brand-600 dark:border-white/[0.08] dark:border-t-brand-500" />
            <span className="text-sm text-graphite-400 dark:text-gray-500">Calculando balanço...</span>
          </Card>
        ) : selectedPivotId && assignment && !error ? (
          <Card className="py-14 text-center">
            <p className="text-graphite-500 dark:text-gray-400">Sem dados suficientes para o balanço deste pivô. Verifique o clima e a condição inicial.</p>
          </Card>
        ) : null
      )}

      {(activeTab === "dados" || activeTab === "decisao") && selectedPivotId && assignment && (
        <div className="space-y-3">
          <div className="flex flex-wrap items-center gap-1.5">
            <span className="mr-1 text-[11px] font-semibold uppercase tracking-wide text-graphite-400 dark:text-gray-500">Período</span>
            {([7, 15, 30, 60, "safra"] as const).map((p) => (
              <button key={String(p)} type="button" onClick={() => applyPeriod(p)} disabled={p === "safra" && !assignment?.planting_date}
                className={`rounded-lg border px-2.5 py-1 text-[11.5px] font-semibold transition-colors disabled:opacity-40 ${activePeriod === p ? "border-brand-300 bg-brand-50 text-brand-700 dark:border-brand-500/40 dark:bg-brand-900/20 dark:text-brand-300" : "border-gray-200 bg-white text-graphite-600 hover:bg-gray-50 dark:border-white/[0.08] dark:bg-white/[0.04] dark:text-gray-300 dark:hover:bg-white/[0.08]"}`}>
                {p === "safra" ? "Safra" : `${p}d`}
              </button>
            ))}
          </div>
          <BalanceTab
            panel={activeTab}
            rows={balanceRows}
            summary={summary}
            loading={loading || calculating}
            head={centroHead}
            weatherByDate={weatherByDate}
            sensoryByDate={sensoryByDate}
          />
        </div>
      )}

      {activeTab === "lancamento" && selectedPivotId && assignment && (
        <LancamentoTab
          pivotId={selectedPivotId}
          pivots={pivots}
          date={lancDate}
          time={lancTime}
          depth={lancDepth}
          hours={lancHours}
          notes={lancNotes}
          saving={lancSaving}
          message={lancMsg}
          onDateChange={setLancDate}
          onTimeChange={setLancTime}
          onDepthChange={(v) => {
            setLancDepth(v);
            const pivot = pivots.find((p) => p.id === selectedPivotId);
            const n = parseFloat(v);
            if (pivot && Number.isFinite(n) && n > 0) setLancHours(String(deriveOperatingHours(n, pivot.area, pivot.flow_rate)));
          }}
          onHoursChange={setLancHours}
          onNotesChange={setLancNotes}
          onSave={handleLancamento}
        />
      )}
'''
          page, n = pattern.subn(replacement, page, count=1)
          if n != 1:
              raise SystemExit(f'unified tabs area: substituições={n}')

          # 3) Fases no gráfico de consumo.
          page = replace_once(page, '    kc: r.kc,\n    isForecast: false,', '    kc: r.kc,\n    phase: r.phase,\n    isForecast: false,', 'phase hist')
          page = replace_once(page, '      kc: p.kc,\n      isForecast: true,', '      kc: p.kc,\n      phase: p.phase,\n      isForecast: true,', 'phase forecast')

          # 4) Cockpit recebe perfil de solo.
          page = replace_once(
              page,
              '  projection,\n  identity,\n  sensoryByDate,',
              '  projection,\n  soilLayers,\n  identity,\n  sensoryByDate,',
              'cockpit args',
          )
          page = replace_once(
              page,
              '  projection: DailyBalanceRow[];\n  identity: CockpitIdentity;',
              '  projection: DailyBalanceRow[];\n  soilLayers: SoilProfileLayer[];\n  identity: CockpitIdentity;',
              'cockpit prop type',
          )

          # 5) Perfil radicular real por camada + CTA total.
          anchor = '  const bottomKpis = [\n'
          profile_code = '''  const rootCm = Math.max(last.rootDepth * 100, 0);
  const profileRows = soilLayers.map((layer) => {
    const thicknessCm = Math.max(layer.depth_end - layer.depth_start, 0);
    const cadLayer = Math.max((layer.field_capacity - layer.wilting_point) * (thicknessCm / 100) * 1000, 0);
    const exploredCm = Math.max(Math.min(rootCm, layer.depth_end) - layer.depth_start, 0);
    const exploredPct = thicknessCm > 0 ? clampN((exploredCm / thicknessCm) * 100, 0, 100) : 0;
    const cadEffective = cadLayer * (exploredPct / 100);
    return { layer, cadLayer, exploredPct, cadEffective };
  });
  const ctaProfile = profileRows.reduce((sum, row) => sum + row.cadLayer, 0);
  const pFactor = cad > 0 ? afd / cad : 0;

  const bottomKpis = [
'''
          page = replace_once(page, anchor, profile_code, 'profile metrics')

          # 6) KPIs agronômicos viram a primeira faixa do cockpit (sem duplicar depois).
          old_kpis = '''  const bottomKpis = [
    { icon: <IconSun />, label: "ETo", value: fmtNum(last.et0), unit: "mm/dia" },
    { icon: <IconLeaf />, label: "Kc", value: fmtNum(last.kc, 2) },
    { icon: <IconSprout />, label: "Ks", value: fmtNum(last.ks ?? 1, 2) },
    { icon: <IconLayers />, label: "CAD", value: fmtNum(cad), unit: "mm" },
    { icon: <IconDrop />, label: "AFD", value: fmtNum(afd), unit: "mm" },
    { icon: <IconRoot />, label: "Raiz efetiva", value: fmtNum(last.rootDepth, 2), unit: "m" },
    { icon: <IconWave />, label: "Sensibilidade hídrica", value: kySens ?? "—", tone: kySensColor },
  ];'''
          new_kpis = '''  const bottomKpis = [
    { icon: <IconSun />, label: "ETo hoje", value: fmtNum(last.et0), unit: "mm" },
    { icon: <IconLeaf />, label: "Kc", value: fmtNum(last.kc, 2) },
    { icon: <IconWave />, label: "ETc potencial", value: fmtNum(last.etcPotential ?? last.etc), unit: "mm" },
    { icon: <IconSprout />, label: "Ks", value: fmtNum(last.ks ?? 1, 2) },
    { icon: <IconDrop />, label: "ARM", value: fmtNum(arm), unit: "mm" },
    { icon: <IconLayers />, label: "CAD", value: fmtNum(cad), unit: "mm" },
    { icon: <IconAlert />, label: "AFD", value: fmtNum(afd), unit: "mm" },
    { icon: <IconLeaf />, label: "p", value: fmtNum(pFactor, 2) },
    { icon: <IconRoot />, label: "Raiz efetiva", value: fmtNum(last.rootDepth, 2), unit: "m" },
  ];'''
          page = replace_once(page, old_kpis, new_kpis, 'top KPI definitions')

          # 7) Insere KPIs logo no topo e simplifica cabeçalho do pivô.
          page = replace_once(
              page,
              '  return (\n    <div className="space-y-4">\n      {/* Cabeçalho do pivô selecionado */}',
              '  return (\n    <div className="space-y-4">\n      <div className="grid grid-cols-2 gap-2.5 sm:grid-cols-3 xl:grid-cols-9">\n        {bottomKpis.map((k) => (\n          <StatCard key={k.label} icon={k.icon} label={k.label} value={k.value} unit={k.unit} tone={k.tone} />\n        ))}\n      </div>\n\n      {/* Cabeçalho do pivô selecionado */}',
              'insert top KPI row',
          )
          header_metrics_pattern = re.compile(r'        <div className="mt-3\.5 grid grid-cols-2 gap-px overflow-hidden rounded-xl bg-gray-100 sm:grid-cols-3 lg:grid-cols-6 dark:bg-white/\[0\.06\]">.*?        </div>\n      </Card>', re.S)
          page, n = header_metrics_pattern.subn('      </Card>', page, count=1)
          if n != 1:
              raise SystemExit(f'remove duplicated header metrics: {n}')

          # 8) Gráficos maiores.
          page = replace_once(page, 'className="h-[220px] w-full"><EntradasConsumoChart', 'className="h-[270px] w-full"><EntradasConsumoChart', 'entries height')
          page = replace_once(page, 'className="h-[260px] w-full"><ReservatorioChart', 'className="h-[330px] w-full"><ReservatorioChart', 'reservoir height')

          # 9) Perfil explorado pela raiz, no lado direito, após projeção.
          profile_card = '''
          <Card className="p-4">
            <div className="mb-3 flex items-center justify-between gap-3">
              <p className="flex items-center gap-1.5 text-[13px] font-bold text-graphite-900 dark:text-white"><IconRoot /> Perfil explorado pela raiz</p>
              <span className="text-[10.5px] font-semibold text-graphite-400 dark:text-gray-500">Zr {fmtNum(last.rootDepth, 2)} m</span>
            </div>
            {profileRows.length > 0 ? (
              <>
                <div className="overflow-hidden rounded-xl border border-gray-100 dark:border-white/[0.06]">
                  <div className="grid grid-cols-[1.1fr_.8fr_.8fr_.9fr] gap-2 bg-gray-50 px-2.5 py-2 text-[9.5px] font-semibold uppercase tracking-wide text-graphite-400 dark:bg-white/[0.03] dark:text-gray-500">
                    <span>Camada</span><span>CAD</span><span>Explorada</span><span>CAD efetiva</span>
                  </div>
                  {profileRows.map((row, i) => (
                    <div key={`${row.layer.depth_start}-${row.layer.depth_end}`} className="grid grid-cols-[1.1fr_.8fr_.8fr_.9fr] gap-2 border-t border-gray-100 px-2.5 py-2 text-[11.5px] tabular-nums text-graphite-600 dark:border-white/[0.05] dark:text-gray-300">
                      <span className="font-semibold">{row.layer.depth_start}–{row.layer.depth_end} cm</span>
                      <span>{fmtNum(row.cadLayer)} mm</span>
                      <span>{fmtNum(row.exploredPct, 0)}%</span>
                      <span className="font-bold text-graphite-900 dark:text-white">{fmtNum(row.cadEffective)} mm</span>
                    </div>
                  ))}
                </div>
                <div className="mt-3 grid grid-cols-2 gap-2 text-[11.5px]">
                  <div className="rounded-xl bg-gray-50 p-2.5 dark:bg-white/[0.03]"><p className="text-graphite-400 dark:text-gray-500">CTA perfil completo</p><p className="mt-0.5 font-extrabold text-graphite-900 dark:text-white">{fmtNum(ctaProfile)} mm</p></div>
                  <div className="rounded-xl bg-gray-50 p-2.5 dark:bg-white/[0.03]"><p className="text-graphite-400 dark:text-gray-500">CAD efetiva hoje</p><p className="mt-0.5 font-extrabold text-graphite-900 dark:text-white">{fmtNum(cad)} mm</p></div>
                  <div className="rounded-xl bg-gray-50 p-2.5 dark:bg-white/[0.03]"><p className="text-graphite-400 dark:text-gray-500">Fator p</p><p className="mt-0.5 font-extrabold text-graphite-900 dark:text-white">{fmtNum(pFactor, 2)}</p></div>
                  <div className="rounded-xl bg-gray-50 p-2.5 dark:bg-white/[0.03]"><p className="text-graphite-400 dark:text-gray-500">AFD</p><p className="mt-0.5 font-extrabold text-graphite-900 dark:text-white">{fmtNum(afd)} mm</p></div>
                </div>
                <p className="mt-2 text-[10px] leading-relaxed text-graphite-400 dark:text-gray-500">CAD por camada = (CC − PMP) × espessura. A CAD efetiva considera somente a fração já explorada pela raiz.</p>
              </>
            ) : (
              <p className="text-[12px] text-graphite-400 dark:text-gray-500">Perfil por camadas não cadastrado para este pivô.</p>
            )}
          </Card>

'''
          page = replace_once(page, '          {/* Nota de umidade de campo + Alertas */}', profile_card + '          {/* Nota de umidade de campo + Alertas */}', 'root profile card')

          # 10) Remove KPI duplicado do rodapé.
          footer_pattern = re.compile(r'\n      \{/\* KPIs agronômicos \(rodapé\) \*/\}\n      <div className="grid grid-cols-2 gap-2\.5 sm:grid-cols-4 xl:grid-cols-7">.*?      </div>\n', re.S)
          page, n = footer_pattern.subn('\n', page, count=1)
          if n != 1:
              raise SystemExit(f'remove footer kpis: {n}')

          # 11) Gráfico de entrada: faixa fenológica por data.
          chart = replace_once(chart, '  kc?: number | null;\n  isForecast: boolean;', '  kc?: number | null;\n  phase?: string | null;\n  isForecast: boolean;', 'chart phase type')
          chart = replace_once(chart, '  const padB = 28;', '  const padB = 48;', 'chart bottom padding')
          chart = replace_once(
              chart,
              '  const kc = splitSeries(points, (p) => p.kc, x, yKc);\n',
              '''  const kc = splitSeries(points, (p) => p.kc, x, yKc);
  const phaseRuns: Array<{ phase: string; start: number; end: number }> = [];
  points.forEach((p, i) => {
    const phase = p.phase?.trim();
    if (!phase) return;
    const lastRun = phaseRuns[phaseRuns.length - 1];
    if (lastRun && lastRun.phase === phase && lastRun.end === i - 1) lastRun.end = i;
    else phaseRuns.push({ phase, start: i, end: i });
  });
''',
              'phase runs',
          )
          chart = replace_once(
              chart,
              '      {points.map((p, i) => (n <= 16 || i % 2 === 0) ? (\n        <text key={`x${i}`} x={x(i)} y={H - 8} textAnchor="middle" className="fill-graphite-400 dark:fill-gray-500" fontSize={9}>{p.label}</text>\n      ) : null)}',
              '''      {points.map((p, i) => (n <= 16 || i % 2 === 0) ? (
        <text key={`x${i}`} x={x(i)} y={H - 27} textAnchor="middle" className="fill-graphite-400 dark:fill-gray-500" fontSize={9}>{p.label}</text>
      ) : null)}

      {/* Faixa fenológica — usa exatamente a fase calculada pelo motor. */}
      {phaseRuns.map((run, i) => {
        const x1 = padL + band * run.start;
        const width = band * (run.end - run.start + 1);
        const fills = ["#14532d", "#166534", "#365314", "#713f12", "#7c2d12"];
        return (
          <g key={`${run.phase}-${run.start}`}>
            <rect x={x1} y={H - 18} width={width} height={12} rx={2} fill={fills[i % fills.length]} opacity={0.72} />
            {width > 70 && <text x={x1 + width / 2} y={H - 9} textAnchor="middle" fill="#e5e7eb" fontSize={8.2} fontWeight={700}>{run.phase}</text>}
          </g>
        );
      })}''',
              'phase band',
          )

          page_path.write_text(page, encoding='utf-8')
          chart_path.write_text(chart, encoding='utf-8')
          PY

      - name: Validate TypeScript
        run: npm ci && npx tsc --noEmit

      - name: Commit interface
        run: |
          git config user.name "Cotrim Irrigacao Bot"
          git config user.email "actions@github.com"
          git add 'app/(app)/balanco-hidrico/page.tsx' 'components/water-balance/CockpitCharts.tsx'
          git commit -m 'feat(manejo): consolidar interface operacional v3'
          git push origin main
