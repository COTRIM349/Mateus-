name: Apply Manejo V3 Interface

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-manejo-v3-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply interface patch
        run: python scripts/apply_manejo_v3_runner.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit interface
        run: |
          git config user.name "Cotrim Irrigacao Bot"
          git config user.email "actions@github.com"
          git add 'app/(app)/balanco-hidrico/page.tsx' 'components/water-balance/CockpitCharts.tsx'
          git commit -m 'feat(manejo): consolidar interface operacional v3'
          git push origin main
