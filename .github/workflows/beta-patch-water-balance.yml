name: Beta water balance one-shot patch

on:
  push:
    branches:
      - beta/operacao-segura-20260829

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/operacao-segura-20260829
          fetch-depth: 0
      - name: Patch water balance beta safety flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/(app)/balanco-hidrico/page.tsx')
          text = p.read_text(encoding='utf-8')

          replacements = [
            (
              'import { ManejoChart, ManejoSeriesPicker } from "@/components/charts/ManejoChart";\n',
              'import { ManejoChart, ManejoSeriesPicker } from "@/components/charts/ManejoChart";\nimport { HydricInitialConditionForm } from "@/components/water-balance/HydricInitialConditionForm";\n',
            ),
            (
              '    setCalculating(true);\n    setError("");\n\n    try {',
              '    setCalculating(true);\n    setError("");\n    setBalanceRows([]);\n\n    try {',
            ),
            (
              '      setBalanceRows(rows);\n    } catch (err) {\n      setError(err instanceof Error ? err.message : "Erro ao calcular balanço");',
              '      setBalanceRows(rows);\n    } catch (err) {\n      setBalanceRows([]);\n      setError(err instanceof Error ? err.message : "Erro ao calcular balanço");',
            ),
            (
              '        {error && <p role="alert" className="mt-3 rounded-xl bg-red-50 p-3 text-xs text-red-600 dark:bg-red-950/30 dark:text-red-400">{error}</p>}\n      </Card>',
              '        {error && <p role="alert" className="mt-3 rounded-xl bg-red-50 p-3 text-xs text-red-600 dark:bg-red-950/30 dark:text-red-400">{error}</p>}\n        {assignment && !hydricAnchor && (\n          <HydricInitialConditionForm\n            farmId={activeFarmId}\n            assignmentId={assignment.id}\n            defaultDate={assignment.management_start_date ?? assignment.planting_date}\n            onSaved={(anchor) => {\n              setHydricAnchor(anchor);\n              setBalanceRows([]);\n              setError("");\n              setDateStart(addDaysIso(anchor.effectiveDate, 1));\n            }}\n          />\n        )}\n      </Card>',
            ),
          ]

          changed = False
          for old, new in replacements:
            if new in text:
              continue
            if old not in text:
              raise SystemExit(f'Expected beta patch anchor not found: {old[:100]!r}')
            text = text.replace(old, new, 1)
            changed = True

          if changed:
            p.write_text(text, encoding='utf-8')
      - name: Commit beta patch
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(app)/balanco-hidrico/page.tsx'
          git commit -m 'fix: make water balance beta flow fail-safe'
          git push origin HEAD:beta/operacao-segura-20260829
