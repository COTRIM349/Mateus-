name: Stabilize Runtime One-Off

on:
  push:
    branches:
      - stabilize/plataforma-confiavel-20260823

permissions:
  contents: write

jobs:
  patch-and-security-upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch balance logic only
        run: python scripts/stabilize_runtime_patch.py

      - name: Upgrade Next security patch
        run: npm install next@14.2.35 --save-exact

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit generated stabilization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/'(app)'/balanco-hidrico/page.tsx package.json package-lock.json
          git commit -m "stabilize: align balance runtime and patch Next security"
          git push origin HEAD:stabilize/plataforma-confiavel-20260823
